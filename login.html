<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>Iniciar sesión | Uanvelon IA</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17233c;
      --muted: #71809a;
      --line: #e5eaf2;
      --blue: #315ee8;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      background: #f5f7fb;
      color: var(--ink);
    }
    .login-card {
      width: min(420px, calc(100% - 32px));
      padding: 36px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 16px 48px rgb(34 53 89 / 7%);
      text-align: center;
    }
    .logo {
      width: 68px;
      height: 68px;
      margin-bottom: 20px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 13px;
      object-fit: contain;
    }
    h1 { margin: 0; font-size: 24px; letter-spacing: -.035em; }
    .description { margin: 11px 0 25px; color: var(--muted); font-size: 14px; line-height: 1.65; }
    .google-button {
      display: block;
      padding: 13px 18px;
      border: 0;
      border-radius: 9px;
      background: var(--blue);
      color: #fff;
      font-size: 14px;
      font-weight: 650;
      text-decoration: none;
    }
    .google-button:hover { background: #244bc4; }
    .google-button[aria-disabled="true"] { pointer-events: none; opacity: .55; }
    .notice {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }
    .notice.error { color: #a33b43; }
  </style>
</head>
<body>
  <main class="login-card">
    <img class="logo" src="/logo-unach.png" alt="Logotipo de la Universidad Autónoma de Chiapas">
    <h1>Uanvelon IA</h1>
    <p class="description">Inicie sesión con una cuenta de Google autorizada para acceder al asistente IA de Uanvelon.</p>
    <a class="google-button" id="google-button" href="/auth/google/start">Continuar con Google</a>
    <p class="notice" id="notice" role="status" aria-live="polite"></p>
  </main>
  <script>
    const messages = {
      not_configured: "El acceso con Google aún no está configurado. Configure las credenciales privadas en Render.",
      cancelled: "El inicio de sesión fue cancelado. Puede intentarlo de nuevo.",
      invalid_state: "No se pudo verificar el inicio de sesión. Inténtelo de nuevo.",
      oauth_failed: "No fue posible completar el inicio de sesión. Inténtelo de nuevo más tarde."
    };
    const notice = document.getElementById("notice");
    const googleButton = document.getElementById("google-button");
    const error = new URLSearchParams(window.location.search).get("error");

    if (error && messages[error]) {
      notice.textContent = messages[error];
      notice.classList.add("error");
    }

    fetch("/api/auth-status")
      .then((response) => response.json())
      .then((status) => {
        if (status.enabled && !status.configured) {
          notice.textContent = messages.not_configured;
          notice.classList.add("error");
          googleButton.setAttribute("aria-disabled", "true");
        }
      })
      .catch(() => {
        notice.textContent = "No se pudo consultar el estado del servicio. Inténtelo de nuevo más tarde.";
        notice.classList.add("error");
        googleButton.setAttribute("aria-disabled", "true");
      });
  </script>
</body>
</html>
