services:
  - type: web
    name: uanvelon
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python web.py --proveedor anthropic --host 0.0.0.0
    healthCheckPath: /health
    envVars:
      - key: AUTH_ENABLED
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: APP_SECRET_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
